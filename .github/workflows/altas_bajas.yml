name: Altas y bajas

# Separa altas de bajas y las cruza con los dias en que se publico, para
# saber si publicar dispara bajas o si son rotacion de fondo.
# Escribe contenido/altas_bajas.md y lo commitea.
#
# No tiene cron: se corre a mano cuando hace falta la pregunta.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/altas_bajas.py"
      - ".github/workflows/altas_bajas.yml"

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/altas_bajas.py

      - name: Guardar el informe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contenido/altas_bajas.md
          git diff --cached --quiet && exit 0
          git commit -m "Informe de altas y bajas [skip ci]"
          # Otro workflow puede pushear entre el pull y el push. El que
          # pierde la carrera reintenta en vez de quedar en rojo.
          for intento in 1 2 3 4 5; do
            git pull --rebase origin main || exit 1
            git push && exit 0
            echo "push rechazado, reintento $intento"
            sleep $((RANDOM % 8 + 3))
          done
          exit 1
