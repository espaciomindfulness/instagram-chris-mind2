name: Publicar en Instagram

on:
  schedule:
    # Pide correr cada 30 minutos, pero GitHub estrangula los workflows
    # programados de los repos con poca actividad: en noviembre de 2026 se
    # estaba disparando cada OCHO horas. No se puede confiar en el cron para
    # que algo salga a una hora pensada.
    - cron: "*/30 * * * *"

  # Por eso tambien corre cuando cambia el calendario. Programar algo ya
  # vencido lo publica en el momento, sin depender del cron ni de que alguien
  # pueda entrar a GitHub a apretar el boton.
  #
  # No entra en bucle: el bot commitea el estado con "[skip ci]", que GitHub
  # respeta, asi que su propio commit no vuelve a disparar el workflow.
  push:
    paths:
      - "contenido/calendario.json"

  workflow_dispatch:
    inputs:
      simulacro:
        description: "Simulacro (no publica de verdad)"
        type: boolean
        default: false

# Evita dos corridas pisandose entre si (doble publicacion)
concurrency:
  group: publicar-instagram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar calendario
        run: python scripts/validar.py

      - name: Publicar lo que corresponda
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/contenido/publicar
          IG_DRY_RUN: ${{ inputs.simulacro && '1' || '0' }}
        run: python scripts/publicar.py

      - name: Guardar estado del calendario
        if: always()
        run: |
          git config user.name "publicador-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet contenido/calendario.json; then
            git add contenido/calendario.json
            git commit -m "Actualizar estado del calendario [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
